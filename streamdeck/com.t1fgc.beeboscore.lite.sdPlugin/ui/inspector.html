<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BeeboScore</title>
<style>
  /* matches the Stream Deck property inspector look */
  body { margin: 0; padding: 10px 14px 14px 10px; background: #2d2d2d; color: #d8d8d8; font: 9pt "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; -webkit-user-select: none; user-select: none; }
  .row { display: flex; align-items: center; min-height: 32px; margin: 2px 0; }
  .row > label { flex: none; width: 100px; text-align: right; padding-right: 12px; color: #969696; }
  .row > .v { flex: 1; min-width: 0; }
  select, input[type=text] { width: 100%; height: 26px; box-sizing: border-box; background: #3d3d3d; color: #d8d8d8; border: none; border-radius: 0; padding: 0 6px; font: inherit; outline: none; }
  select:focus, input:focus { outline: 1px solid #5a5a5a; }
  .check { display: flex; align-items: center; gap: 6px; color: #d8d8d8; }
  .status { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #c0392b; flex: none; }
  .dot.on { background: #2fd17a; }
  .muted { color: #969696; font-size: 8pt; line-height: 1.4; }
  button { height: 26px; background: #3d3d3d; color: #d8d8d8; border: none; padding: 0 10px; font: inherit; cursor: pointer; }
  button:hover { background: #4a4a4a; }
  .hide { display: none !important; }
  hr { border: 0; border-top: 1px solid #3d3d3d; margin: 10px 0; }
</style>
</head>
<body>
  <div class="row" id="rowSide"><label>Player</label><div class="v"><select id="side"><option value="1">Player 1</option><option value="2">Player 2</option></select></div></div>
  <div class="row" id="rowMode"><label>Key press</label><div class="v"><select id="mode">
    <option value="tapHold">Tap +1 · hold −1</option><option value="add">Add 1</option><option value="subtract">Subtract 1</option></select></div></div>
  <div class="row" id="rowLayoutMode"><label>Switch to</label><div class="v"><select id="lmode">
    <option value="next">Next layout for this game</option><option value="any">Next layout (any game)</option><option value="specific">A specific layout…</option></select></div></div>
  <div class="row" id="rowLayout"><label>Layout</label><div class="v"><select id="layout"></select></div></div>
  <div class="row" id="rowFKind"><label>Shows</label><div class="v"><select id="fkind"><option value="fboard">The board (teams / Death Battle / standings)</option><option value="fvs">Team VS</option><option value="fwin">Champion</option><option value="flead">King of the Hill leaderboard</option></select></div></div>
  <div class="row" id="rowVsStyle"><label>Plays</label><div class="v"><select id="vsstyle"><option value="">The VS style chosen in the app (hold to switch)</option><option value="full">Always FullVS</option><option value="glass">Always GlassVS</option></select></div></div>
  <div class="row" id="rowFxq"><label>Press to</label><div class="v"><select id="fxq"><option value="cycle">Step Auto → Full → Light → Ultra-light</option><option value="auto">Set Auto</option><option value="full">Set Full</option><option value="light">Set Light</option><option value="ultra">Set Ultra-light</option></select></div></div>
  <div class="row" id="rowSound"><label>Press to</label><div class="v"><select id="smode"><option value="toggle">Turn sound on / off</option><option value="up">Louder (+10%)</option><option value="down">Quieter (−10%)</option></select></div></div>
  <div class="row" id="rowScreen"><label>Screen</label><div class="v"><select id="screen"></select></div></div>
  <div class="row" id="rowBSide"><label>Press to</label><div class="v"><select id="bside">
    <option value="toggle">Flip Winners ⇄ Losers</option><option value="L">Show the Losers side</option><option value="W">Show the Winners side</option></select></div></div>
  <div class="row" id="rowWho"><label>Who won</label><div class="v"><select id="who"><option value="streamer">I won (+1 for me)</option><option value="viewer">The viewer won (+1 for them)</option></select></div></div>
  <div class="row" id="rowHold"><label></label><div class="v"><label class="check"><input type="checkbox" id="hold"> Hold the key to reset (prevents accidents)</label></div></div>
  <div class="row" id="rowAuto"><label>Automation</label><div class="v"><input type="text" id="auto" placeholder="Its name (empty: the first one)" spellcheck="false"></div></div>
  <div class="row" id="rowLabel"><label>Chapter name</label><div class="v"><input type="text" id="clabel" placeholder="Highlight" spellcheck="false" maxlength="60"></div></div>
  <div class="row" id="rowSpeed"><label>Speed</label><div class="v"><select id="speed"><option value="50">50% (slow motion)</option><option value="25">25%</option><option value="75">75%</option></select></div></div>
  <div class="row" id="rowMins"><label>Minutes</label><div class="v"><select id="cdMins"><option value="1">+1 minute</option><option value="2">+2 minutes</option><option value="5">+5 minutes</option><option value="10">+10 minutes</option></select></div></div>   <!-- 1.12.19 -->
  <div class="row" id="rowExt"><label>Extension</label><div class="v"><input type="text" id="extid" placeholder="Its id (empty: the first one)" spellcheck="false"></div></div>
  <div class="row" id="rowCue"><label>Screen or cue</label><div class="v"><input type="text" id="extcue" placeholder="Its id (empty: its first)" spellcheck="false"></div></div>
  <div class="row" id="rowNote"><label></label><div class="v muted" id="note"></div></div>
  <hr>
  <div class="row"><label>BeeboScore</label><div class="v status"><span class="dot" id="dot"></span><span id="conn">Looking for BeeboScore…</span></div></div>
  <div class="row"><label>Address</label><div class="v"><input type="text" id="address" placeholder="Automatic (this PC)" spellcheck="false"></div></div>
  <div class="row"><label></label><div class="v" style="display:flex;gap:6px"><button id="retry">Reconnect</button><button id="open">Open BeeboScore</button></div></div>
  <div class="row"><label></label><div class="v muted">Leave the address empty to find BeeboScore on this PC automatically (the app on port 3000, or the Beta build on 3100).</div></div>
<script>
let sock, uuid, action, settings = {}, globals = {}, layouts = [], screens = [];
const $ = id => document.getElementById(id);
const kind = () => String(action || '').replace('com.t1fgc.beeboscore.lite.', '');
const send = (event, extra) => sock && sock.readyState === 1 && sock.send(JSON.stringify({ event, ...extra }));
function show() {
  const k = kind();
  $('rowSide').classList.toggle('hide', !['score', 'player', 'loser', 'fswitch', 'stats', 'walkin'].includes(k));
  $('rowSpeed').classList.toggle('hide', k !== 'replayslow'); $('speed').value = String(settings.speed || 50);       // 1.12.18
  $('rowMins').classList.toggle('hide', k !== 'cdplus'); $('cdMins').value = String(settings.mins || 1);          // 1.12.19
  $('rowExt').classList.toggle('hide', k !== 'ext'); $('rowCue').classList.toggle('hide', k !== 'ext'); $('extid').value = settings.ext || ''; $('extcue').value = settings.cue || '';
  $('rowAuto').classList.toggle('hide', k !== 'automation'); $('auto').value = settings.auto || '';
  $('rowLabel').classList.toggle('hide', k !== 'chapter'); $('clabel').value = settings.label || '';
  $('rowMode').classList.toggle('hide', k !== 'score');
  $('rowLayoutMode').classList.toggle('hide', k !== 'layout');
  $('rowLayout').classList.toggle('hide', !(k === 'layout' && settings.mode === 'specific'));
  $('rowHold').classList.toggle('hide', k !== 'reset');
  $('rowScreen').classList.toggle('hide', k !== 'screen');
  $('rowFxq').classList.toggle('hide', k !== 'fxq'); $('fxq').value = settings.fxq || 'cycle';
  $('rowSound').classList.toggle('hide', k !== 'sound'); $('smode').value = settings.smode || 'toggle';
  $('rowFKind').classList.toggle('hide', k !== 'fsplash'); $('fkind').value = settings.kind || 'fboard';
  $('rowVsStyle').classList.toggle('hide', k !== 'vs'); $('vsstyle').value = settings.style || '';
  $('screen').innerHTML = screens.length ? screens.map(o => `<option value="${o.id}">${o.name}</option>`).join('') : `<option value="">${settings.screenName || 'No screens in the active layout'}</option>`;
  if (settings.screen) $('screen').value = settings.screen;
  $('rowBSide').classList.toggle('hide', k !== 'bracketside');
  $('rowWho').classList.toggle('hide', k !== 'viewerresult');
  const notes = {
    score: 'On a Stream Deck + dial: turn to change the score, press to add 1.',
    fswitch: 'Team Death Battle: after a life is lost, each press puts that team\'s next fighter in (they keep their lives). Pick P1 or P2 above.',
    player: 'Opens a pop-up in BeeboScore to type a name or pick from your start.gg entrants and past players. Tab switches player.',
    nextmatch: 'Loads the next match from your start.gg stream queue (or the next open match) with scores at 0–0.',
    clear: 'Clears both players for the next set.',
    vs: 'FullVS — or, if you leave “Plays” on the app’s choice, whichever VS style is chosen in the app (FullVS or GlassVS). Tap to show or hide; hold to switch the style. Lit while on stream.',
    bracket: 'Shows or hides the full-screen bracket from start.gg. Once the event reaches Top 8 it shows the Top 8 splash instead (you can turn that off in BeeboScore).',
    top8: 'Shows or hides the Top 8 splash. The key lights up while it is on stream.',
    postlink: 'Posts the live bracket page link in Twitch chat, so viewers can follow the bracket and find their next match. Lights up purple when it can post: the live bracket page is on (Bracket tab › Share & export), BeeboScore is online, and Twitch is signed in.',
    standings: 'Shows or hides the Top 8 standings splash — 1st to 8th place, with profile pictures or character art (Bracket tab › Share & export). It says STANDINGS once there are results, and lights up while it is on stream. BeeboScore also shows it by itself when a tournament ends.',
    victory: 'Shows or hides the full-screen victory splash for the set winner. It lights up gold while it is on stream. BeeboScore can also show it by itself when a set ends (Settings › Scoreboard).',
    bracketside: 'Big brackets show Winners and Losers on separate pages that take turns (set the timing in BeeboScore). This key jumps to a side right away and restarts the timer. If the bracket is not on stream, it brings it up on that side. The lit tab shows the side on stream.',
    bracketrefresh: 'Fetches the latest results from start.gg for the bracket and Top 8 splashes right now.',
    latency: 'Shows how many viewers have your overlay open and how many milliseconds the last update took to reach the slowest one. Press it to send a test update.',
    undo: 'Steps back one change, like Ctrl+Z in the app. When the last thing was a game format result, it takes that back instead.',
    playervs: 'GlassVS — the glass lock-in VS (the two players face to face, pictures framed, names under them). Any match or format; stays up until you press again.',
    flock: 'Team Death Battle: locks in the fighters picked for this battle; the Player VS pops up.',
    hideall: 'Takes every full-screen splash off at once (FullVS, GlassVS, Victory, Bracket, Top 8, Standings, format and viewer splashes). The scoreboard stays.',
    viewernext: 'Twitch viewer matches: brings up the next viewer in the queue and plays the viewer VS splash. Shows who is next and how many are waiting.',
    viewerresult: 'Twitch viewer matches: counts a game for you or the viewer. Tap +1, hold to take one back. Put one key for each side.',
    viewerqueue: 'Twitch viewer matches: opens or closes the queue. While it is open, chat can type !join. Green = open.',
    viewersplash: 'Twitch viewer matches: shows or hides the streamer vs viewer splash for the current match.',
    viewersidebar: 'Twitch viewer matches: slides the “how to join” sidebar off screen or back on. Lit = on screen.',
    fnext: 'Game formats: shows the battle score (2–1, 5 left…). Turns green when a set is won — press to confirm the result and load the next match.',
    fundo: 'Game formats: takes back the last recorded result.',
    fsplash: 'Game formats: shows or hides a format splash (the board, Team VS, the champion, or the King of the Hill leaderboard). Lit while on stream.',
    vsstyle: 'Switches what the VS key plays: FullVS (the full VS splash) or GlassVS (the glass lock-in VS). Works for any format or match.',
    fxq: 'Effects quality for the layout. Ultra-light is for very weak PCs: no glows or looping effects, fewer particles, entrances that only slide and fade. The key shows the current level.',
    obsrefresh: 'Reloads the BeeboScore overlay in OBS: every browser source showing it swaps in a fresh copy, seamlessly. Nothing else in OBS is touched. The key shows DONE.',
    screen: 'Shows or hides one of the active layout’s designer screens (Starting soon, BRB, Top 8, lower thirds…). Lit = on stream.',
    tempo: 'Tap along with the music (three taps or more): pieces set to “On the beat” in the Layout Designer pulse with it. Hold to stop the beat.',
    autopilot: 'Run of show on or off: after each set, the victory screen, a stinger, the bracket splash while the next match loads, then back to the scoreboard. The key shows the step it’s on.',
    replay: 'Instant replay: OBS saves its Replay Buffer and the clip plays in its own scene with your stinger in and out. The BeeboScore window does it, so keep it open.',
    automation: 'Runs one of your automations (BeeboScore › Settings › Automations), whatever it waits for. Type its name above. Lit while it runs.',
    chapter: 'Marks this moment as a chapter in the stream’s video (BeeboScore › Settings › VOD chapters), with the name above. Says MARKED.',
    stats: 'Shows the player’s stats card on stream — their record, characters and the head-to-head, from Player history. Press again to hide it. Lit while it’s on.',
    sponsor: 'Shows the next sponsor straight away. Hold to turn the rotation on or off (BeeboScore › Settings › Sponsors).',
    rundown: 'Your rundown (BeeboScore › Show): tap for the next segment — its screen, OBS scene, automation and chapter come with it. Hold to go back one. Shows the segment and the time left.',
    countdown: 'The countdown screen (Starting soon / Back in a few), to the end of the rundown segment — on or off.',
    schedule: 'The Coming up screen: the rest of the rundown with real times — on or off.',
    walkin: 'A player’s walk-in screen: picture, record, best results, head-to-head and their walk-in music (BeeboScore › Players). Pick Player 1 or 2.',
    storyline: 'A talking point for this set (a rematch, a losers run, a reverse sweep…) as a card on stream. Tap: on / off · hold: the next one. Greyed out until there is one.',
    evstats: 'The event in numbers, full screen: sets, games, the longest set, comebacks, the most-played characters.',
    season: 'The season table (BeeboScore › Players › Seasons), full screen.',
    rehearsal: 'Rehearsal mode: a made-up set through every screen, card and splash, so you can check OBS and this deck. Nothing is reported, said or posted. Press again to stop and put everything back.',
    replayslow: 'Plays the instant replay in slow motion (and back to full speed). The speed is above.',
    cdplus: 'More time on the countdown while it’s on stream (it doesn’t start again). How much is above.',
    replayfreeze: 'Freezes the instant replay on a frame — press again to let it play.',
    drawclear: 'Clears what you drew on the replay (BeeboScore › Show › Replay 2.0).',
    clip: 'Clip this: the last moments from OBS’s Replay Buffer saved as a vertical (9:16) video for Shorts, TikTok and Reels, in the Highlights folder.',
    results: 'Makes the results pictures (Top 8, winner, bracket) in BeeboScore, ready to save or post to Discord.',
    picks: 'The prediction game: opens the picks for this set (viewers type !pick 1 or !pick 2), or locks them. Needs Twitch chat on.',
    poll: 'Starts your last poll again (BeeboScore › Twitch › Polls), or ends the one that’s running.',
    twpred: 'Twitch’s own prediction for this set: tap to start it, again to lock it, again once the set is won to pay out. Needs the extra Twitch permissions (BeeboScore › Twitch).',
    music: 'The music player on or off (BeeboScore › Stream › Music).',
    duck: 'Turns the music down while you talk, and back up.',
    ext: 'An extension’s screen (on / off) or cue (BeeboScore › Settings › Extensions). Type their ids above.',
    moments: 'Moment banners on or off. With them on, BeeboScore says the set’s story on stream by itself — match point, a comeback, a sweep, an upset, a runback, a losers run, a Grand Final reset (pick which in BeeboScore › Settings › Scoreboard). The key shows the one that’s up.',
    momentreplay: 'Shows the last moment’s banner on stream again. Greyed out until the first moment of the night.',
    h2h: 'The head-to-head of the two players on the scoreboard (from Player history) as a line on stream — press again to hide it. It steps aside for a moment’s banner and during a game format.',
    settimer: 'The set timer in the header on stream. Tap: start · tap again: stop · tap again: start over from zero. Hold: take it off the stream. BeeboScore › Settings › Scoreboard can time every set by itself.',
  };
  $('note').textContent = notes[k] || '';
  $('rowNote').classList.toggle('hide', !notes[k]);
  $('side').value = String(settings.side || 1);
  $('mode').value = k === 'score' ? (settings.mode || 'tapHold') : 'tapHold';
  if (k === 'layout') $('lmode').value = settings.mode || 'next';
  $('hold').checked = !!settings.hold;
  $('bside').value = settings.bside || 'toggle';
  $('who').value = settings.who === 'viewer' ? 'viewer' : 'streamer';
  $('layout').innerHTML = layouts.map(o => `<option value="${o.name}">${(o.game ? o.game + ' — ' : '') + o.title}</option>`).join('');
  if (settings.layout) $('layout').value = settings.layout;
  $('address').value = globals.address || '';
}
function save(patch) { settings = { ...settings, ...patch }; send('setSettings', { context: uuid, payload: settings }); show(); }
$('side').onchange = e => save({ side: Number(e.target.value) });
$('mode').onchange = e => save({ mode: e.target.value });
$('bside').onchange = e => save({ bside: e.target.value });
$('who').onchange = e => save({ who: e.target.value });
$('lmode').onchange = e => save({ mode: e.target.value, layout: settings.layout || (layouts[0] && layouts[0].name) });
$('layout').onchange = e => save({ layout: e.target.value });
$('fkind').onchange = e => save({ kind: e.target.value });
$('vsstyle').onchange = e => save({ style: e.target.value });
$('smode').onchange = e => save({ smode: e.target.value });
$('fxq').onchange = e => save({ fxq: e.target.value });
$('screen').onchange = e => { const o = screens.find(x => x.id === e.target.value); save({ screen: e.target.value, screenName: o ? o.name : '' }); };
$('hold').onchange = e => save({ hold: e.target.checked });
$('auto').onchange = e => save({ auto: e.target.value.trim() });
$('clabel').onchange = e => save({ label: e.target.value.trim() });
$('speed').onchange = e => save({ speed: Number(e.target.value) });
$('cdMins').onchange = e => save({ mins: Number(e.target.value) });
$('extid').onchange = e => save({ ext: e.target.value.trim().toLowerCase() });
$('extcue').onchange = e => save({ cue: e.target.value.trim().toLowerCase() });
$('address').onchange = e => {
  let v = e.target.value.trim(); if (v && !/^https?:\/\//.test(v)) v = 'http://' + v;
  globals = { ...globals, address: v.replace(/\/+$/, '') }; send('setGlobalSettings', { context: uuid, payload: globals });
  $('conn').textContent = 'Connecting…';
};
$('retry').onclick = () => { $('conn').textContent = 'Connecting…'; send('sendToPlugin', { action, context: uuid, payload: { refresh: true } }); };
$('open').onclick = () => send('sendToPlugin', { action, context: uuid, payload: { openApp: true } });

// Stream Deck calls this when the property inspector opens
function connectElgatoStreamDeckSocket(port, inUUID, registerEvent, info, actionInfo) {
  uuid = inUUID;
  const ai = JSON.parse(actionInfo || '{}');
  action = ai.action; settings = (ai.payload && ai.payload.settings) || {};
  if (kind() === 'score' && !settings.side) settings.side = 1;
  show();
  sock = new WebSocket('ws://127.0.0.1:' + port);
  sock.onopen = () => { send(registerEvent, { uuid }); send('getGlobalSettings', { context: uuid }); };
  sock.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.event === 'didReceiveGlobalSettings') { globals = (m.payload && m.payload.settings) || {}; show(); }
    else if (m.event === 'didReceiveSettings') { settings = (m.payload && m.payload.settings) || {}; show(); }
    else if (m.event === 'sendToPropertyInspector') {
      const d = m.payload || {};
      layouts = d.layouts || layouts; screens = d.screens || screens;
      if (kind() === 'screen' && !settings.screen && screens.length) save({ screen: screens[0].id, screenName: screens[0].name });
      $('dot').classList.toggle('on', !!d.online);
      $('conn').textContent = d.online ? `Connected · v${d.version || ''} · ${String(d.address || '').replace(/^https?:\/\//, '')}` : 'BeeboScore not found — is the app open?';
      show();
    }
  };
}
</script>
</body>
</html>
