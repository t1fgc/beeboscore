<!DOCTYPE html>
<html lang="en">
<head>
<meta name="sb-look" content="porcelain">
<meta charset="utf-8">
<meta name="sb-vs" content="porcelain">
<meta name="sb-victory" content="porcelain">
<meta name="sb-format" content="splash">
<title>Porcelain</title>
<!--
  PORCELAIN.  1920 x 1080, transparent. One layout for every fighting game. Developed by Beebo.
  Ember's sister layout, glazed white: the same frame, positions and HUD-safe footprint, with dark lettering,
  ember-orange fire and its own break.

  A white porcelain frame that runs along the top of the HUD. It covers everything round the game's
  round-win circles, with a hole and a lit rim for each one (never covering them), and leaves the
  timer and portraits clear.

  ANIMATION
    • Intro: an ember line traces the frame, the porcelain lights up, names decode in.
    • Ember currents run along the frame edge.
    • Taking a game: shockwave + sparks from the score.
    • Facing elimination (opponent one game away): hairline cracks glow in the plate.
    • Set over: the loser's bar shatters round the score and is knocked out of shape: the pieces are shoved,
      tilted and set at odd heights over molten light, and it throbs as if it could still burst. The name and
      score stay readable and nothing reaches down onto the health bars.
      The winner's plate turns gold. Then the white victory splash takes the screen.
      Reset the scores (or load the next match) and the pieces close up again.

  LINING UP
    Add a Custom field  guide → on  to show where the game's HUD sits.
    Positions live in the GEOMETRY block in the script at the bottom.
-->
<style>
  @font-face { font-family: 'Saira Condensed'; font-weight: 800; font-style: normal; src: local('Saira Condensed ExtraBold'), url(/static/fonts/saira-condensed-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Saira Condensed'; font-weight: 700; src: url(/static/fonts/saira-condensed-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 600; src: url(/static/fonts/chakra-petch-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 700; src: url(/static/fonts/chakra-petch-latin-700-normal.woff2) format('woff2'); }
  :root {
    --void: #040406;
    --obsidian-1: #17181d;
    --obsidian-2: #0b0c0f;
    --obsidian-3: #050507;
    --ash: #5d616c;
    --steel: #d9dce4;
    --muted: #8d919d;
    --ember: #ff5a1f;
    --ember-hot: #ffb36b;
    --ember-deep: #a3180a;
    --gold-hi: #fff4cf;
    --gold: #f6c453;
    --gold-mid: #d99a2b;
    --gold-lo: #8a5a12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  body { font-family: 'Saira Condensed', 'Arial Narrow', Impact, sans-serif; color: var(--steel); }

  /* ================= frame outline (svg) ================= */
  #frame { position: absolute; left: 0; top: 0; width: 1920px; height: 120px; overflow: visible; pointer-events: none; z-index: 5; }
  #frame .edge { fill: none; stroke: url(#edgeGrad); stroke-width: 1.6; stroke-linejoin: round; opacity: .9; }
  #frame .comet { fill: none; stroke: var(--ember-hot); stroke-width: 2.6; stroke-linecap: round; opacity: 0; }   /* no blur filter: it was redrawn every frame */
  .sb-ready #frame .comet { opacity: .95; transition: opacity .6s 1.2s; }
  #frame .edge.dead { stroke: var(--ember-deep); opacity: .35; animation: smolder 2.4s ease-in-out infinite; }
  #frame .edge.champ { stroke: #fff1c2; stroke-width: 2.6; filter: url(#glow) drop-shadow(0 0 6px #f6c453); transition: stroke .5s; }
  /* the light that runs round each plate follows it: gold on the winner's, nearly out on the loser's */
  #frame .comet.champ { stroke: #fff1c2; }
  #frame .comet.dead { opacity: .22 !important; }
  @keyframes smolder { 50% { opacity: .15; } }

  /* ================= plates ================= */
  .plate { position: absolute; top: 0; opacity: 0; transition: opacity .5s .55s, filter .9s .55s; filter: brightness(3) saturate(0); z-index: 2; }
  .sb-ready .plate { opacity: 1; filter: none; }
  /* the loser's plate: fractured, dimmed glass that stays on screen */
  .plate.cracked .skin { filter: brightness(.55) saturate(.5); transition: filter .5s; }
  /* …but its lettering stays readable: the name keeps most of its light and a dark halo, and the score box stays solid,
     so the final score never has cracks showing through it */
  .plate.cracked .who { opacity: .82; filter: saturate(.45); transition: opacity .5s, filter .5s; }
  .plate.cracked .name { filter: drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 5px rgba(0,0,0,.95)); }
  .plate.cracked .score { filter: saturate(.45) brightness(.82); transition: filter .5s; }
  .plate.cracked .cracks path { opacity: .8; stroke: #ff6a2a; animation: smolder-crack 2.6s ease-in-out infinite; }
  .plate.cracked .cracks path.outer { opacity: .45; stroke-width: .9; }
  @keyframes smolder-crack { 50% { opacity: .35; } }
  /* the winner's plate: lit up in gold */
  /* winner: heavenly golden light pours down through the glass (not a flat gold fill) */
  .gild { position: absolute; inset: 0; opacity: 0; transition: opacity .9s; pointer-events: none; mix-blend-mode: screen;
    background:
      linear-gradient(105deg, transparent 38%, rgba(255,255,255,.75) 50%, transparent 62%) no-repeat,
      repeating-linear-gradient(104deg, transparent 0 34px, rgba(255,240,190,.13) 34px 44px, transparent 44px 70px),
      radial-gradient(ellipse 70% 170% at 50% -60%, rgba(255,250,228,.8), rgba(246,196,83,.42) 40%, rgba(217,154,43,.16) 70%, transparent 90%),
      linear-gradient(0deg, rgba(246,196,83,.35), transparent 40%);
    background-size: 260% 100%, 100% 100%, 100% 100%, 100% 100%; background-position: 140% 0, 0 0, 0 0, 0 0; }
  .plate.champ .gild { opacity: 1; animation: gild-glint 3.4s .4s ease-in-out infinite, gild-breathe 2.8s steps(20, jump-none) infinite; }
  @keyframes gild-glint { 0%, 45% { background-position: 140% 0, 0 0, 0 0, 0 0; } 100% { background-position: -40% 0, 0 0, 0 0, 0 0; } }
  @keyframes gild-breathe { 50% { filter: brightness(1.18); } }
  .halo { position: absolute; top: -36px; height: 150px; pointer-events: none; z-index: 1; opacity: 0; transition: opacity .9s;
    background: radial-gradient(ellipse 48% 42% at 50% 40%, rgba(255,240,190,.75), rgba(246,196,83,.32) 50%, transparent 74%); }
  .halo.on { opacity: 1; animation: halo 3s ease-in-out infinite; }
  @keyframes halo { 50% { opacity: .65; transform: scaleX(1.03); } }
  /* the lettering on the lit plate: a dark edge and a soft shadow under it, so it reads against the light */
  .plate.champ .who { background: radial-gradient(ellipse 58% 82% at 50% 52%, rgba(28,20,7,.6), rgba(28,20,7,.28) 55%, transparent 78%); }
  .plate.champ .name { background: linear-gradient(180deg, #ffffff 0%, #fffaf0 40%, #ffe7a3 70%, #f6c453 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 1px rgba(40,22,0,1)) drop-shadow(0 2px 0 rgba(40,22,0,.85)) drop-shadow(0 0 7px rgba(255,226,140,.5)); animation: heavenly 2.6s steps(20, jump-none) infinite; }
  @keyframes heavenly { 50% { filter: drop-shadow(0 0 1px rgba(40,22,0,1)) drop-shadow(0 2px 0 rgba(40,22,0,.85)) drop-shadow(0 0 13px rgba(255,236,170,.85)); } }
  .plate.champ .team { color: #ffe7a3; text-shadow: 0 1px 0 rgba(40,22,0,.95), 0 0 2px rgba(40,22,0,.9), 0 0 8px rgba(246,196,83,.7); }
  .plate.champ .line2 { color: #fff1c2; text-shadow: 0 1px 0 rgba(40,22,0,.95), 0 0 2px rgba(40,22,0,.9), 0 0 6px rgba(246,196,83,.7); }
  .plate.champ .arm .lbl { color: #ffe7a3; text-shadow: 0 1px 0 rgba(40,22,0,.9); }
  .plate.champ .pip { border-color: #ffe7a3; background: rgba(255,226,140,.15); }
  .plate.champ .pip.on { background: linear-gradient(135deg, #fff, #fff1c2 40%, #c98a1c); border-color: #fff8e0; box-shadow: 0 0 10px rgba(255,236,170,.9); }
  .plate.champ.gold-in { animation: gold-in .8s ease-out; }
  @keyframes gold-in { 0% { filter: brightness(2.6) saturate(.4); } 100% { filter: none; } }
  .skin {
    position: absolute; inset: 0;
    background:
      linear-gradient(162deg, transparent 0 38%, rgba(255,255,255,.025) 38% 39%, transparent 39%),
      linear-gradient(18deg, transparent 0 63%, rgba(255,255,255,.02) 63% 64%, transparent 64%),
      linear-gradient(180deg, var(--obsidian-1) 0%, var(--obsidian-2) 46%, var(--obsidian-3) 100%);
  }
  /* the sheen that crosses the bar now and then: its own layer, moved (not repainted), so it costs next to nothing */
  .skin::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 260%; pointer-events: none; will-change: transform;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.07) 50%, transparent 58%);
    transform: translateX(-73.8%); animation: glint 9s ease-in-out infinite; }
  .p2 .skin::before { animation-delay: 4.5s; }
  .sh .skin::before { display: none; }
  @keyframes glint { 0%, 70% { transform: translateX(-73.8%); } 100% { transform: translateX(12.3%); } }
  .skin::after { /* ember underglow at the bottom edge */
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: linear-gradient(0deg, rgba(255,90,31,.16), transparent);
  }

  .body { position: absolute; top: 0; height: 100%; display: flex; align-items: center; gap: 12px; }
  .p1 .body { padding: 0 12px 0 28px; }
  .p2 .body { padding: 0 28px 0 12px; flex-direction: row-reverse; }
  .who { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding-top: 4px; }
  .p2 .who { align-items: flex-end; }
  .line1, .line2 { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; white-space: nowrap; }
  .p2 .line1, .p2 .line2 { flex-direction: row-reverse; }

  .flag { flex: none; width: 34px; height: 22px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.2); filter: saturate(.85); }
  .flag.none { display: none; }
  .team { flex: none; font-weight: 800; font-size: 22px; letter-spacing: 1.5px; color: var(--ember); text-transform: uppercase; }
  .name {
    /* room above and right of the letters, so accents (Å, É, Ñ) and the italic slant are never cut off */
    min-width: 0; overflow: hidden; white-space: nowrap; padding: .14em 8px .06em 2px; margin: -.14em -3px -.06em -2px;
    font-weight: 800; font-style: italic; font-size: 36px; line-height: 1; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #e9ebf0 40%, #8f939d 52%, #d9dce3 76%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,.7));
  }
  .ltag { flex: none; font: 700 13px/18px 'Chakra Petch', sans-serif; padding: 0 6px; background: var(--steel); color: #08080a; clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
  /* the small lettering (status line, event line, SET, 1P / 2P) is a size up from the first design and never darker
     than the accent colour: it is the first thing to go soft when a stream is compressed */
  .line2 { font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 2.2px; text-transform: uppercase; color: var(--steel); height: 15px; line-height: 15px; }
  .line2 > span:first-child { opacity: .78; }
  .status { display: none; color: var(--ember); font-weight: 700; letter-spacing: 2.6px; }
  .plate.matchpoint .status.mp { display: inline; color: var(--ember-hot); animation: blink 1s steps(2) infinite; }
  .plate.danger .status.dg { display: inline; }
  .plate.champ .status.win { display: inline; color: var(--ember-hot); }
  .plate.matchpoint.danger .status.mp, .plate.matchpoint.danger .status.dg { display: none; }
  .plate.matchpoint.danger .status.fin { display: inline; color: var(--ember-hot); animation: blink 1s steps(2) infinite; }
  .plate.champ .status.mp, .plate.champ .status.dg, .plate.champ .status.fin { display: none; }
  @keyframes blink { 50% { opacity: .45; } }

  /* score */
  .score {
    flex: none; position: relative; width: 66px; height: 50px; display: grid; place-items: center;
    background: linear-gradient(180deg, #1c1d23, #07070a);
    box-shadow: inset 0 0 0 1px rgba(255,90,31,.55), inset 0 0 18px rgba(255,90,31,.18);
    clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  }
  .score .num { font: 700 38px/1 'Chakra Petch', sans-serif; color: #fff; text-shadow: 0 0 14px rgba(255,90,31,.55); display: inline-block; }
  .score .side { position: absolute; top: 2px; font: 700 10px 'Chakra Petch', sans-serif; letter-spacing: 1px; color: var(--ember-hot); }
  .p1 .score .side { left: 11px; }
  .p2 .score .side { right: 11px; }
  .score.hit { animation: scorehit .7s ease-out; }
  @keyframes scorehit {
    0% { background: linear-gradient(180deg, #ffd0a0, #ff5a1f); }
    30% { background: linear-gradient(180deg, #ff7a3a, #a3180a); }
    100% { background: linear-gradient(180deg, #1c1d23, #07070a); }
  }
  .score .num.slam { animation: slam .6s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes slam { 0% { transform: scale(2.6) translateY(-6px); opacity: 0; filter: blur(4px); } 55% { transform: scale(.88); opacity: 1; filter: none; } 100% { transform: none; } }
  .plate.champ .score { background: linear-gradient(180deg, #1c1407, #050302); box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 22px rgba(246,196,83,.75); }
  .plate.champ .score .num { color: #fff4cf; text-shadow: 0 0 14px rgba(246,196,83,.9); }
  .plate.champ .score .side { color: var(--gold); }
  .plate.champ .status.win { color: #fff6d8 !important; }

  /* shockwave ring */
  .wave { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 2px solid var(--ember-hot); pointer-events: none; z-index: 8; animation: wave .7s ease-out forwards; }
  @keyframes wave { from { transform: scale(.5); opacity: 1; } to { transform: scale(9); opacity: 0; border-width: .5px; } }

  /* arm over the round circles: set pips */
  .arm { position: absolute; top: 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .arm .lbl { font: 700 10px 'Chakra Petch', sans-serif; letter-spacing: 2.2px; color: var(--muted); }
  .pips { display: flex; gap: 7px; }
  .p2 .pips { flex-direction: row-reverse; }
  .pip { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid #4a4d57; background: #0a0a0d; transition: all .35s; }
  .pip.on { background: linear-gradient(135deg, #ffd0a0, var(--ember) 55%, var(--ember-deep)); border-color: #ffd9b8; box-shadow: 0 0 10px rgba(255,90,31,.9); }

  /* hairline cracks (when facing elimination) */
  .cracks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .cracks path { fill: none; stroke: var(--ember); stroke-width: 1.1; opacity: 0; filter: url(#glow); }
  .plate.danger .cracks path.inner { opacity: .75; animation: crackpulse 1.4s ease-in-out infinite; }
  @keyframes crackpulse { 50% { opacity: .3; } }

  /* ================= centre tag ================= */
  .center { position: absolute; top: 0; opacity: 0; transition: opacity .5s .7s; z-index: 2; }
  .sb-ready .center { opacity: 1; }
  .center .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 1px; }
  .meta { font: 700 11px/13px 'Chakra Petch', sans-serif; letter-spacing: 1.7px; text-transform: uppercase; color: var(--ember); white-space: nowrap; max-width: 92%; overflow: hidden; display: flex; gap: 7px; }
  .meta .dot { color: var(--muted); }
  .meta > span { flex: none; }
  .meta.long > span:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* too long even at the smallest size: the event ends in … */
  .round { margin-top: 0; line-height: 21px; font-weight: 800; font-style: italic; font-size: 20px; letter-spacing: 1px; text-transform: uppercase; color: #fff; white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis; padding-right: 3px; }
  .center.gf .round { background: linear-gradient(180deg, #fff1df, #ffb36b 50%, #ff5a1f); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* ================= sparks ================= */
  #sparks { position: absolute; left: 0; top: 0; width: 1920px; height: 520px; pointer-events: none; z-index: 7; }
  /* reversed win: the cracks seal and the plate re-forges */
  .plate.reform { transition: none !important; animation: reform .5s ease-out; }
  @keyframes reform { 0% { filter: saturate(1.7) brightness(1.06); transform: scale(1.012); } 100% { filter: none; transform: none; } }   /* the glaze settles; the bar never vanishes */
  .flash { animation: flash .35s ease-out; }
  @keyframes flash { 0% { filter: brightness(3.2) contrast(1.3); } 100% { filter: none; } }
  .shake { animation: shake .38s linear; }
  @keyframes shake { 0%,100% { transform: none; } 20% { transform: translate(-3px, 1px); } 40% { transform: translate(3px, -1px); } 60% { transform: translate(-2px, 1px); } 80% { transform: translate(2px, 0); } }

  /* ================= commentators ================= */
  .cast {
    position: absolute; left: 50%; bottom: 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 34px;
    background: linear-gradient(180deg, var(--obsidian-1), var(--obsidian-3));
    clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
    font-weight: 700; font-size: 24px; letter-spacing: .5px; white-space: nowrap;
    transform: translate(-50%, 110%); transition: transform .7s 1s cubic-bezier(.2,.9,.25,1.1);
  }
  .sb-ready .cast { transform: translate(-50%, 0); }
  .cast::before { content: ''; position: absolute; left: 16px; right: 16px; top: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--ember), transparent); }
  .cast svg { width: 18px; height: 18px; fill: var(--ember); }
  .cast small { font-weight: 600; font-size: 18px; color: var(--muted); }
  .cast .sep { color: var(--ember); }

  /* ================= guide ================= */
  .guide div { position: absolute; border: 2px dashed #39ff88; background: rgba(57,255,136,.1); font: 700 11px 'Chakra Petch', sans-serif; color: #39ff88; padding: 2px 4px; z-index: 20; }
  /* player names centred in their plates */
  .who, .p2 .who { align-items: center; }
  .line1, .line2, .p2 .line1, .p2 .line2 { justify-content: center; }
  /* ================= PORCELAIN: white palette ================= */
  :root { --obsidian-1: #ffffff; --obsidian-2: #f1f2f5; --obsidian-3: #d9dce3; --steel: #15171d; --muted: #6c7180; --ash: #b4b8c2; }
  .skin {
    background:
      linear-gradient(162deg, transparent 0 38%, rgba(20,24,34,.05) 38% 39%, transparent 39%),
      linear-gradient(18deg, transparent 0 63%, rgba(20,24,34,.04) 63% 64%, transparent 64%),
      linear-gradient(180deg, var(--obsidian-1) 0%, var(--obsidian-2) 46%, var(--obsidian-3) 100%);
    box-shadow: inset 0 -1px 0 rgba(255,90,31,.5);
  }
  .skin::after { background: linear-gradient(0deg, rgba(255,90,31,.12), transparent); }
  .skin::before { background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%); }
  .plate.champ .skin::before { opacity: .5; }
  .name { background: linear-gradient(180deg, #3a3e4a 0%, #15171d 45%, #000 55%, #2c2f39 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.9)); }
  .line2 { color: #3a3e4a; }
  .ltag { color: #fff; }
  .round { color: #15171d; }
  .center.gf .round { background: linear-gradient(180deg, #ff8a3d 0%, #e2430c 55%, #a3180a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }   /* Grand Finals: deep ember, readable on the glaze */
  .meta .dot { color: #9a9fab; }
  .pip { border-color: #b9bdc7; background: #fff; }
  .score { background: linear-gradient(180deg, #24262e, #0b0c10); }

  /* winner: warm gold in the white */
  .plate.champ .skin { background: linear-gradient(180deg, #fffdf6 0%, #fff0c8 48%, #f3cf74 100%); }
  .plate.champ .gild { mix-blend-mode: normal; opacity: .55; }
  .plate.champ .who { background: none; }
  .plate.champ .name { background: linear-gradient(180deg, #8a5a0c 0%, #5a3a05 48%, #3a2402 55%, #9a6a14 100%); -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.95)); animation: none; }
  .plate.champ .team, .plate.champ .line2 { color: #7a5208; text-shadow: 0 1px 0 rgba(255,255,255,.8); }
  .plate.champ .status.win { color: #b2400a !important; font-weight: 700; text-shadow: 0 1px 0 rgba(255,255,255,.85); }
  .plate.champ .arm .lbl { color: #8a5a0c; text-shadow: none; }

  .status, .plate.matchpoint .status.mp, .plate.matchpoint.danger .status.fin { color: #e2430c; }

  /* ================= PORCELAIN: the loser's bar, knocked out of shape ================= */
  .cracks { display: none; }
  /* molten light under the glaze, hottest at the score where it broke */
  .core { position: absolute; inset: 0; z-index: 1; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse 300px 110px at var(--ox) var(--oy), #ffffff 0%, #fff2a8 10%, #ffc23a 28%, #ff7a12 50%, #ff3d0a 75%, #c41c0a 100%); }
  /* the bar's surface, in pieces: each piece is a copy of the skin cut to its shape */
  .shards { position: absolute; inset: 0; z-index: 2; pointer-events: none; display: none; }
  .sh { position: absolute; inset: 0; transform-origin: var(--cx) var(--cy); will-change: transform; }
  .sh .skin { clip-path: var(--poly); }
  .sh svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; }
  .sh polygon { fill: none; stroke-linejoin: round; }
  .sh .k { stroke: #4a1404; opacity: .55; }
  .sh .c { stroke: #ff5a14; }
  .sh .h { stroke: #ffd08a; }
  .sh .j0 .c, .sh .j1 .c { stroke: #ffb02a; }
  .sh .j0 .h, .sh .j1 .h { stroke: #fffbe8; }
  /* heat building round the score, as if it will go any second */
  .bloom { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse 120px 46px at var(--ox) var(--oy), rgba(255,200,90,.75), rgba(255,120,30,.38) 45%, rgba(255,80,20,.12) 70%, transparent 85%); }
  .plate.breaking .bloom { opacity: 1; }
  .plate.cracked .bloom { opacity: .85; animation: bloom 2.4s ease-in-out infinite; }
  @keyframes bloom { 0%, 45%, 100% { opacity: .8; transform: none; } 58% { opacity: 1; transform: scale(1.25); } }
  .bloom { transform-origin: var(--ox) var(--oy); }
  .plate.danger:not(.cracked):not(.breaking) .sh:not(.inner) svg { display: none; }
  .plate.danger:not(.cracked):not(.breaking) .sh .k, .plate.danger:not(.cracked):not(.breaking) .sh .h { display: none; }
  .plate.danger:not(.cracked):not(.breaking) .sh .c { stroke-width: 1.1px !important; opacity: .8; }
  .plate.danger .shards, .plate.breaking .shards, .plate.cracked .shards { display: block; }
  .plate.danger .core, .plate.breaking .core, .plate.cracked .core { opacity: 1; }
  .plate.cracked > .skin, .plate.breaking > .skin { visibility: hidden; }
  .plate.danger:not(.cracked):not(.breaking) .sh.inner { animation: hair 1.4s ease-in-out infinite; }
  @keyframes hair { 50% { filter: drop-shadow(0 0 2px #ff8a1a); } }
  .plate.cracked .sh { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); animation: pressure 2.4s ease-in-out infinite; }
  .plate.cracked .core { animation: heat 2.4s ease-in-out infinite; }
  .plate.cracked .shards { animation: tremor .11s steps(2) infinite; }
  @keyframes pressure { 0%, 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
    45% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); }
    58% { transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3)) rotate(calc(var(--r) * 1.25)); }
    70% { transform: translate(calc(var(--dx) * 1.06), calc(var(--dy) * 1.06)) rotate(var(--r)); } }
  @keyframes heat { 0%, 45%, 100% { filter: brightness(1); } 58% { filter: brightness(1.5) saturate(1.2); } }
  @keyframes tremor { 0% { transform: translate(.6px, 0); } 50% { transform: translate(-.6px, .4px); } }
  .plate.cracked .shards .skin, .plate.breaking .shards .skin { filter: brightness(var(--b)) sepia(.25) saturate(1.2); }
  /* knocked out of shape: the bar's outline no longer holds the pieces in; everything else keeps to it */
  .plate.cracked, .plate.breaking { clip-path: none !important; }
  .plate.cracked > .gild, .plate.cracked > .core, .plate.cracked > .bloom, .plate.breaking > .gild, .plate.breaking > .core, .plate.breaking > .bloom { clip-path: var(--shape); }
  .sh .pc { position: absolute; inset: 0; clip-path: var(--piece); }
  /* pieces may stick out upward and past the far end, but not into the cut-out over the round counters,
     and never more than 2 px down, where the health bars are */
  .plate.cracked .shards, .plate.breaking .shards { clip-path: var(--grow); }
  /* each piece's shadow is a dark copy of its shape just below it, not a filter: a filter on a moving piece is redrawn
     every frame (it cost two thirds of the frame rate) */
  .sh .sd { display: none; position: absolute; inset: 0; clip-path: var(--poly); background: rgba(70,25,5,.34); transform: translateY(1.4px); }
  .sh.inner .sd { background: rgba(150,40,5,.42); transform: translateY(1.6px); }
  .plate.breaking .sh .sd, .plate.cracked .sh .sd { display: block; }
  /* name and score stay on top, clear of the cracks */
  .body, .arm { z-index: 5; }   /* the set pips too: the pieces never cover them */
  .plate.cracked .who { opacity: 1; filter: none; }
  .plate.cracked .name { filter: drop-shadow(0 1px 0 rgba(255,255,255,.95)) drop-shadow(0 0 4px rgba(255,255,255,.9)); }
  .plate.cracked .line2 { text-shadow: 0 0 3px #fff, 0 0 6px #fff; }
  .plate.cracked .score { filter: none; }
</style>
</head>

<script>
(() => {
  // =====================================================================
  // GEOMETRY — measured from a 1920x1080 game capture.
  //   Portraits end at x≈164 / start at x≈1756. Round circles (Tekken 8): centres x 736.6,
  //   770.6, 804.7 and 1112.6, 1146.6, 1180.6, y 53.7, radius ≈13.4. Timer digits start at
  //   y≈42. Health bars start at y≈69.
  // =====================================================================
  const H = 69;            // plate height (ends just above the health bars)
  const ARM_H = 31;        // the part over the round circles that holds the set pips
  const P1_X = 176, P2_X = 1090, PLATE_W = 654;   // plates
  const C_X = 830, C_W = 260, C_H = 36;           // centre tag (ends above the timer digits)
  const NOTCH = 114;       // width of the part over the round circles

  // Shapes in each element's own coordinates.
  const SHAPE = {
    // bottom corners: 18 px on the outside; a small 7 px cut by the round circles, so the third circle keeps a full rim
    p1: [[0, 0], [PLATE_W, 0], [PLATE_W, H - 7], [PLATE_W - 7, H], [18, H], [0, H - 18]],
    p2: [[0, 0], [PLATE_W, 0], [PLATE_W, H - 18], [PLATE_W - 18, H], [7, H], [0, H - 7]],
    c:  [[0, 0], [C_W, 0], [C_W, 24], [C_W - 12, C_H], [12, C_H], [0, 24]],
  };
  // a hole for each round circle (a little wider than the circle, so its rim shows), cut out of the plate
  const HOLE_R = 15, HOLE_Y = 53.7;
  const HOLES = { 1: [736.6, 770.6, 804.7].map(x => x - P1_X), 2: [1112.6, 1146.6, 1180.6].map(x => x - P2_X) };
  const ring = (x, y, r) => `M${x - r} ${y} a${r} ${r} 0 1 0 ${2 * r} 0 a${r} ${r} 0 1 0 ${-2 * r} 0 Z`;
  const holes = (side, dx = 0) => HOLES[side].map(x => ring(x + dx, HOLE_Y, HOLE_R)).join(' ');
  const clipHoles = (pts, side) => `path(evenodd, "M${pts.map(([x, y]) => `${x} ${y}`).join(' L')} Z ${holes(side)}")`;
  const clip = pts => `polygon(${pts.map(([x, y]) => `${x}px ${y}px`).join(',')})`;
  const pathOf = (pts, dx) => 'M' + pts.map(([x, y]) => `${x + dx},${y}`).join('L') + 'Z';

  const $ = id => document.getElementById(id);
  const plates = { 1: $('plate1'), 2: $('plate2') };

  function layout() {
    Object.assign(plates[1].style, { left: P1_X + 'px', width: PLATE_W + 'px', height: H + 'px', clipPath: clipHoles(SHAPE.p1, 1) });
    Object.assign(plates[2].style, { left: P2_X + 'px', width: PLATE_W + 'px', height: H + 'px', clipPath: clipHoles(SHAPE.p2, 2) });
    Object.assign($('center').style, { left: C_X + 'px', width: C_W + 'px', height: C_H + 'px', clipPath: clip(SHAPE.c) });
    // body = everything left/right of the notch; arm = the part over the circles
    const b1 = plates[1].querySelector('.body'), a1 = plates[1].querySelector('.arm');
    Object.assign(b1.style, { left: 0, width: (PLATE_W - NOTCH) + 'px' });
    Object.assign(a1.style, { left: (PLATE_W - NOTCH) + 'px', width: NOTCH + 'px', height: ARM_H + 'px' });
    const b2 = plates[2].querySelector('.body'), a2 = plates[2].querySelector('.arm');
    Object.assign(b2.style, { left: NOTCH + 'px', width: (PLATE_W - NOTCH) + 'px' });
    Object.assign(a2.style, { left: 0, width: NOTCH + 'px', height: ARM_H + 'px' });
    // outline + ember comets
    const shapes = { 1: [SHAPE.p1, P1_X], C: [SHAPE.c, C_X], 2: [SHAPE.p2, P2_X] };
    for (const [k, [pts, dx]] of Object.entries(shapes)) {
      const d = pathOf(pts, dx) + (k === 'C' ? '' : ' ' + holes(Number(k), dx));   // a lit rim round each circle too
      const edge = $('edge' + k), comet = $('comet' + k);
      edge.setAttribute('d', d); comet.setAttribute('d', d);
      const L = edge.getTotalLength();
      edge.style.strokeDasharray = L; edge.style.strokeDashoffset = L;
      edge.__len = L;
      comet.style.strokeDasharray = `70 ${L}`;
      comet.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -(L + 70) }], { duration: 4200 + L * 2, iterations: Infinity, delay: k === '2' ? 1100 : k === 'C' ? 600 : 0 });
    }
    drawCracks(1); drawCracks(2);
    Object.assign($('halo1').style, { left: (P1_X - 70) + 'px', width: (PLATE_W + 140) + 'px' });
    Object.assign($('halo2').style, { left: (P2_X - 70) + 'px', width: (PLATE_W + 140) + 'px' });
  }

  // ---------------------------------------------------------- seeded randomness
  function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // The break: rays out from the score, crossed by rings, as in Ember's glass. The pieces near the score are small;
  // past the last ring each piece runs to the edge of the plate, so only a ray or two crosses the name.
  function fracture(side) {
    const r = rng(side === 1 ? 3307 : 8821);
    const O = side === 1 ? { x: PLATE_W - NOTCH - 45, y: 34 } : { x: NOTCH + 45, y: 34 };
    const away = side === 1 ? Math.PI : 0;
    const N = 9, KY = .55, RINGS = [26, 76, 1500];
    const rays = [];
    for (let i = 0; i < N; i++) {
      let a = (i / N) * Math.PI * 2 + (r() - .5) * .55;
      if (Math.abs(Math.atan2(Math.sin(a - away), Math.cos(a - away))) < .12) a += .2;    // no ray straight along the name
      rays.push(a);
    }
    rays.sort((p, q) => p - q);
    // a point on ray i at ring j (rings wobble a little from ray to ray)
    const P = rays.map(a => RINGS.map((R, j) => { const k = j === RINGS.length - 1 ? 1 : .7 + r() * .6; return { x: O.x + Math.cos(a) * R * k, y: O.y + Math.sin(a) * R * k * KY }; }));
    // jagged edges: a kink half way along every ray piece (M) and every ring piece (Q), shared by the two shards it divides
    const kink = (p, q, amt) => { const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, L = Math.hypot(q.x - p.x, q.y - p.y) || 1, k = (r() - .5) * amt * Math.min(1, L / 30);
      return { x: mx - (q.y - p.y) / L * k, y: my + (q.x - p.x) / L * k }; };
    const M = rays.map((_, i) => RINGS.slice(0, -1).map((_, j) => kink(P[i][j], P[i][j + 1], j < 1 ? 12 : 20)));
    const Q = rays.map((_, i) => RINGS.slice(0, -1).map((_, j) => kink(P[i][j], P[(i + 1) % N][j], 12)));
    const shards = [];
    // the little piece the blow landed on
    shards.push({ pts: rays.flatMap((_, i) => [P[i][0], Q[i][0]]), j: 0 });
    for (let i = 0; i < N; i++) {
      const i2 = (i + 1) % N, last = RINGS.length - 2;
      for (let j = 0; j <= last; j++) {
        const outer = j === last ? [P[i2][j + 1], P[i][j + 1]] : [P[i2][j + 1], Q[i][j + 1], P[i][j + 1]];
        shards.push({ pts: [P[i][j], Q[i][j], P[i2][j], M[i2][j], ...outer, M[i][j]], j: j + 1 });
      }
    }
    for (const s of shards) {
      const c = s.pts.reduce((m, p) => ({ x: m.x + p.x / s.pts.length, y: m.y + p.y / s.pts.length }), { x: 0, y: 0 });
      if (s.j === RINGS.length - 1) { c.x = Math.max(4, Math.min(PLATE_W - 4, c.x)); c.y = Math.max(4, Math.min(H - 4, c.y)); }
      let dx = c.x - O.x, dy = (c.y - O.y) / KY; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const push = [0, 7, 11][s.j], outer = s.j === RINGS.length - 1;
      // knocked out of place: shoved outward, slid along the seam, set at a different height, tilted, and shaded
      // a little differently, as if each piece now sits at its own angle
      const slide = (r() - .5) * (outer ? 3 : 6), step = (r() - .5) * (outer ? 2.5 : 5);
      s.c = c; s.dx = dx * push - dy * slide; s.dy = dy * push * (outer ? .3 : .9) + dx * slide * .4 + step;
      s.rot = (r() - .5) * (outer ? 1.4 : 3 + s.j * 4);
      s.b = (.86 + r() * .22).toFixed(3);
      // nothing is pushed down onto the health bars: a piece on the bottom edge drops at most 2 px at the height
      // of its pulse, its tilt included (a long piece tilts very little)
      const inPlate = s.pts.map(p => ({ x: Math.max(0, Math.min(PLATE_W, p.x)), y: Math.max(0, Math.min(H, p.y)) }));
      const low = Math.max(...inPlate.map(p => p.y)), hw = (Math.max(...inPlate.map(p => p.x)) - Math.min(...inPlate.map(p => p.x))) / 2 || 1;
      if (low > H - 12) {
        s.dy = Math.min(s.dy, .4);
        const lim = Math.atan(1.2 / hw) * 180 / Math.PI / 1.25;
        s.rot = Math.max(-lim, Math.min(lim, s.rot));
      }
    }
    return { O, shards, P, r };
  }

  function drawCracks(side) {
    const { O, shards } = fracture(side), plate = plates[side];
    plate.style.setProperty('--shape', clipHoles(side === 1 ? SHAPE.p1 : SHAPE.p2, side));
    plate.style.setProperty('--piece', clip(side === 1 ? SHAPE.p1 : SHAPE.p2));   // a piece moves, so its own outline has no holes: the fixed outline round all the pieces cuts them
    const end = side === 1 ? 0 : PLATE_W;                // the far end of the bar, away from the centre
    plate.style.setProperty('--grow', clipHoles((side === 1 ? SHAPE.p1 : SHAPE.p2).map(([x, y]) => [x === end ? end + (side === 1 ? -40 : 40) : x, y === 0 ? -40 : y === H ? H + 2 : y]), side));
    plate.style.setProperty('--ox', O.x + 'px'); plate.style.setProperty('--oy', O.y + 'px');
    plate.querySelector('.shards').innerHTML = shards.map(s =>       { const pts = s.pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' '), w = [5.6, 4.4, 2.8][s.j];
        // each piece carries its own molten edge (a dark crust, the glow, a white-hot thread), so the seams move with it
        return `<div class="sh${s.j <= 1 ? ' inner' : ''}" data-j="${s.j}" style="--poly:polygon(${s.pts.map(p => `${p.x.toFixed(1)}px ${p.y.toFixed(1)}px`).join(',')});--cx:${s.c.x.toFixed(1)}px;--cy:${s.c.y.toFixed(1)}px;--dx:${s.dx.toFixed(2)}px;--dy:${s.dy.toFixed(2)}px;--r:${s.rot.toFixed(2)}deg;--b:${s.b}"><i class="sd"></i><div class="pc"><div class="skin"></div>`
          + `<svg class="j${s.j}" viewBox="0 0 ${PLATE_W} ${H}"><polygon class="k" points="${pts}" style="stroke-width:${(w + 2.4).toFixed(1)}"/><polygon class="c" points="${pts}" style="stroke-width:${w}"/><polygon class="h" points="${pts}" style="stroke-width:${(w * .3).toFixed(2)}"/></svg></div></div>`; }).join('');
  }

  // ---------------------------------------------------------- sparks
  const cv = $('sparks'), ctx = cv.getContext('2d');
  let parts = [], running = false;
  function burst(x, y, n, power = 1, spread = Math.PI * 2, dir = -Math.PI / 2) {
    n = window.SBPerf ? window.SBPerf.n(n) : n;
    for (let i = 0; i < n; i++) {
      const a = dir + (Math.random() - .5) * spread, s = (120 + Math.random() * 420) * power;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, decay: .7 + Math.random() * 1.1, size: 1 + Math.random() * 2.4 });
    }
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }
  function rise(x, y) {
    parts.push({ x, y, vx: (Math.random() - .5) * 30, vy: -(25 + Math.random() * 45), life: 1, decay: .6 + Math.random() * .5, size: .8 + Math.random() * 1.2, float: true });
    if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); }
  }
  let last = 0;
  function tick(t) {
    const P = window.SBPerf;
    if (P && P.paused) { running = false; P.whenAwake(() => { if (!running && parts.length) { running = true; last = performance.now(); requestAnimationFrame(tick); } }); return; }
    const dt = Math.min(.05, (t - last) / 1000); last = t; if (P) P.sample(dt * 1000);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.globalCompositeOperation = 'lighter';
    parts = parts.filter(p => (p.life -= p.decay * dt) > 0);
    for (const p of parts) {
      p.vy += (p.float ? -20 : 900) * dt; p.vx *= .985; p.x += p.vx * dt; p.y += p.vy * dt;
      const r = p.size * 3, L = Math.round(p.life * 6) / 6;
      if (P) { ctx.globalAlpha = p.life; ctx.drawImage(P.glow('sh' + L, [[0, `rgb(255,${180 + 60 * L | 0},${120 * L | 0})`], [1, 'rgba(255,90,31,0)']]), p.x - r, p.y - r, r * 2, r * 2); ctx.globalAlpha = 1; }
      else { const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); g.addColorStop(0, `rgba(255,${180 + 60 * p.life | 0},${120 * p.life | 0},${p.life})`); g.addColorStop(1, 'rgba(255,90,31,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = `rgba(255,200,140,${p.life * .8})`; ctx.lineWidth = p.size * .7;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .025, p.y - p.vy * .025); ctx.stroke();
    }
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0, 0, cv.width, cv.height); }
  }

  // ---------------------------------------------------------- crack / seal
  const plateX = side => side === 1 ? P1_X : P2_X;

  // The plate's look is set directly from the score, the moment it changes. Nothing waits for an
  // animation or event to finish, so a reversed set win restores the plate instantly — even in a
  // hidden/covered browser window or OBS source, where browsers pause animations and slow timers.
  const want = { 1: false, 2: false };
  const token = { 1: 0, 2: 0 };                        // bumps on every change; stale steps bail out
  const timers = { 1: [], 2: [] };
  const later = (side, tok, fn, ms) => timers[side].push(setTimeout(() => { if (tok === token[side]) fn(); }, ms));

  function cleanup(side) {
    const plate = plates[side];
    timers[side].forEach(clearTimeout); timers[side] = [];
    plate.querySelectorAll('.sh, .core').forEach(p => p.getAnimations().forEach(a => { if (!(a instanceof CSSAnimation)) a.cancel(); }));
    plate.classList.remove('shake', 'flash', 'reform', 'breaking');
  }
  const target = sh => `translate(${sh.style.getPropertyValue('--dx')}, ${sh.style.getPropertyValue('--dy')}) rotate(${sh.style.getPropertyValue('--r')})`;

  // set over, loser: the blow lands on the score, the bar shatters outward ring by ring and jolts apart over
  // white-hot light, shudders, flashes, then holds together, throbbing, with sparks spitting from the seams
  function crack(side, tok) {
    const plate = plates[side], { O } = fracture(side);
    plate.classList.add('breaking', 'shake');
    plate.querySelector('.core').animate([{ opacity: 0, filter: 'brightness(2.6)' }, { opacity: 1, filter: 'brightness(2.2)', offset: .25 }, { opacity: 1, filter: 'brightness(1)' }], { duration: 900, fill: 'forwards' });
    plate.querySelectorAll('.sh').forEach(sh => {
      const j = Number(sh.dataset.j), t = target(sh);
      sh.animate([{ transform: 'none' }, { transform: t.replace(/(-?[\d.]+)px/g, (m, v) => (v * 2.1).toFixed(2) + 'px'), offset: .45 }, { transform: t }], { duration: 520, delay: j * 55, fill: 'forwards', easing: 'cubic-bezier(.2,.9,.3,1)' });
    });
    burst(plateX(side) + O.x, O.y, 36, .75);
    later(side, tok, () => { plate.classList.remove('shake'); plate.classList.add('flash'); }, 560);
    later(side, tok, () => {
      plate.classList.remove('flash', 'breaking');
      plate.classList.add('cracked');
      plate.querySelectorAll('.sh, .core').forEach(p => p.getAnimations().forEach(a => { if (!(a instanceof CSSAnimation)) a.cancel(); }));
      $('edge' + side).classList.add('dead'); $('comet' + side).classList.add('dead');
      burst(plateX(side) + O.x, O.y, 60, 1);
      spit(side, tok);
    }, 900);
  }

  // while it holds: sparks spit from the seams, harder on each throb
  function spit(side, tok) {
    const { P } = fracture(side);
    const one = big => { const ray = P[Math.floor(Math.random() * P.length)], p = ray[Math.floor(Math.random() * (big ? 2 : 3))];
      const x = Math.max(6, Math.min(PLATE_W - 6, p.x)), y = Math.max(4, Math.min(H - 4, p.y));
      big ? burst(plateX(side) + x, y, 6, .35) : rise(plateX(side) + x, y); };
    const tick = () => { if (tok !== token[side]) return; one(false); one(false); later(side, tok, tick, 140 + Math.random() * 220); };
    const throb = () => { if (tok !== token[side]) return; one(true); one(true); later(side, tok, throb, 2400); };
    tick(); later(side, tok, throb, 1390);
  }

  // reset: the pieces close up, the light dies, the bar is whole again
  function seal(side, tok) {
    const plate = plates[side], { O } = fracture(side);
    plate.classList.remove('cracked'); plate.classList.add('breaking');
    $('edge' + side).classList.remove('dead'); $('comet' + side).classList.remove('dead');
    plate.querySelectorAll('.sh').forEach(sh => sh.animate([{ transform: target(sh) }, { transform: 'none' }], { duration: 420, fill: 'forwards', easing: 'cubic-bezier(.6,0,.3,1)' }));
    plate.querySelector('.core').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, fill: 'forwards' });
    burst(plateX(side) + O.x, O.y, 24, .45);
    later(side, tok, () => { cleanup(side); plate.classList.add('reform'); later(side, tok, () => plate.classList.remove('reform'), 600); }, 440);
  }

  function setCracked(side, cracked, instant) {
    const plate = plates[side];
    if (instant) {                                     // first load: jump straight to the right look
      want[side] = cracked; const tok = ++token[side]; cleanup(side);
      plate.classList.toggle('cracked', cracked);
      $('edge' + side).classList.toggle('dead', cracked); $('comet' + side).classList.toggle('dead', cracked);
      if (cracked) spit(side, tok);
      return;
    }
    if (want[side] === cracked) return;
    want[side] = cracked;
    const tok = ++token[side];
    cleanup(side);
    cracked ? crack(side, tok) : seal(side, tok);
  }

  // ---------------------------------------------------------- text decode
  const GLYPHS = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&@$';
  function decode(el, dur = 560) {
    const final = el.textContent;
    el.dataset.final = final;
    const start = performance.now();
    const step = t => {
      if (el.dataset.final !== final) return;
      const p = Math.min(1, (t - start) / dur);
      const shown = Math.floor(p * final.length * 1.15);
      let s = '';
      for (let i = 0; i < final.length; i++) s += (i < shown || final[i] === ' ') ? final[i] : GLYPHS[Math.random() * GLYPHS.length | 0];
      el.textContent = s;
      if (p < 1) requestAnimationFrame(step); else el.textContent = final;
    };
    requestAnimationFrame(step);
  }

  // too wide for its box? Measured in fractions of a pixel: a slanted last letter half a pixel too wide is still cut off
  function over(el) {
    if (el.scrollWidth > el.clientWidth + 1) return true;
    const r = document.createRange(); r.selectNodeContents(el); const cs = getComputedStyle(el);
    return r.getBoundingClientRect().width > el.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) + .05;
  }
  function fit(el, max, min) {
    let size = max;
    el.style.fontSize = size + 'px';
    while (over(el) && size > min) el.style.fontSize = (size -= .5) + 'px';
    el.classList.toggle('tight', size < max * .78);      // shrunk a lot: lighter glow so it stays readable
  }
  function fitAll() {
    document.querySelectorAll('.plate .name').forEach(el => fit(el, 36, 20));
    document.querySelectorAll('.round').forEach(el => fit(el, 20, 13));
    document.querySelectorAll('.center .meta').forEach(el => { el.classList.remove('long'); el.style.letterSpacing = '1.7px'; fit(el, 11, 9); if (el.scrollWidth > el.clientWidth + 1) el.style.letterSpacing = '.5px'; el.classList.toggle('long', el.scrollWidth > el.clientWidth + 1); });
  }
  if (document.fonts) { document.fonts.ready.then(fitAll); document.fonts.addEventListener('loadingdone', fitAll); }

  // ---------------------------------------------------------- state
  layout();
  let first = true, prev = {}, introDone = false;

  window.addEventListener('scoreboard', e => {
    const s = e.detail;
    const need = Number(s.firstTo) || 0;
    const winner = s.p1.winner && !s.p2.winner ? 1 : s.p2.winner && !s.p1.winner ? 2 : 0;
    fitAll();

    for (const side of [1, 2]) {
      const p = s['p' + side], o = s['p' + (3 - side)];
      const plate = plates[side];
      document.getElementById('pips' + side).innerHTML = need > 0 && need <= 7
        ? Array.from({ length: need }, (_, i) => `<i class="pip${i < p.score ? ' on' : ''}"></i>`).join('') : '';
      plate.classList.toggle('matchpoint', !winner && need > 1 && p.score === need - 1);
      plate.classList.toggle('danger', !winner && need > 1 && o.score === need - 1);
      const wasChamp = plate.classList.contains('champ');
      plate.classList.toggle('champ', winner === side);
      $('edge' + side).classList.toggle('champ', winner === side);
      $('comet' + side).classList.toggle('champ', winner === side);
      $('halo' + side).classList.toggle('on', winner === side);
      if (!first && winner === side && !wasChamp) {     // just won: the plate lights up in gold
        plate.classList.remove('gold-in'); void plate.offsetWidth; plate.classList.add('gold-in');
        setTimeout(() => plate.classList.remove('gold-in'), 900);
      }
      if (!first && wasChamp && winner !== side)        // reset: the gold fades out instead of switching off
        plate.animate([{ filter: 'sepia(.75) saturate(1.7) brightness(1.06)' }, { filter: 'none' }], { duration: 700, easing: 'ease-out' });

      // decode names when they change (and once after the intro)
      const nameEl = plate.querySelector('.name');
      // (in a game format the format's own smooth name change plays instead: sb-format.js)
      if (!first && prev['n' + side] !== p.name && !(s.format && s.format.status === 'live')) decode(nameEl);
      prev['n' + side] = p.name;

      // a game was taken
      if (!first && p.score > (prev['s' + side] ?? p.score)) {
        const box = plate.querySelector('.score'), num = box.querySelector('.num');
        box.classList.remove('hit'); num.classList.remove('slam'); void box.offsetWidth;
        box.classList.add('hit'); num.classList.add('slam');
        const r = box.getBoundingClientRect();
        const wv = document.createElement('div'); wv.className = 'wave';
        wv.style.left = (r.left + r.width / 2) + 'px'; wv.style.top = (r.top + r.height / 2) + 'px';
        document.body.appendChild(wv); setTimeout(() => wv.remove(), 800);
        burst(r.left + r.width / 2, r.top + r.height / 2, winner === side ? 120 : 40, winner === side ? 1.3 : .8);
      }
      prev['s' + side] = p.score;
    }
    if (!first && prev.round !== s.round) {
      const r = document.querySelector('.round');
      if (s.format && s.format.status === 'live') r.animate([{ opacity: 0, filter: 'blur(3px)', transform: 'translateY(-4px)' }, { opacity: 1, filter: 'none', transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.2,.8,.25,1)' });   // in a format: a calm fade, no scramble
      else decode(r, 420);
    }
    prev.round = s.round;

    // the set is over: the loser's plate cracks (and seals again when it's reset)
    for (const side of [1, 2]) setCracked(side, !!winner && winner !== side, first);

    if (first && window.__SB_INSTANT) {
      // seamless refresh: no intro, just show the finished frame
      first = false;
      for (const k of ['1', 'C', '2']) { const edge = $('edge' + k); edge.style.strokeDashoffset = 0; edge.style.strokeDasharray = 'none'; }
    }
    if (first) {
      first = false;
      // intro: trace the frame, then decode the names
      for (const k of ['1', 'C', '2']) {
        const edge = $('edge' + k);
        edge.animate([{ strokeDashoffset: edge.__len }, { strokeDashoffset: 0 }], { duration: 950, delay: k === 'C' ? 150 : 0, fill: 'forwards', easing: 'cubic-bezier(.6,0,.2,1)' })
          .onfinish = () => { edge.style.strokeDasharray = 'none'; };
      }
      setTimeout(() => {
        document.querySelectorAll('.plate .name').forEach(el => decode(el, 700));
        decode(document.querySelector('.round'), 600);
        burst(960, 22, 30, .5, Math.PI * 1.2, Math.PI / 2);
      }, 750);
    }
  });
})();
</script>
</body>
</html>
