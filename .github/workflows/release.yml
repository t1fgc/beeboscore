# BeeboScore Lite (developed by Beebo): builds the portable exe when a version tag (v1.5.0) is pushed, and attaches it to a
# DRAFT release. Nothing is public until you press "Publish release" — see docs/RELEASING.md.
name: Build release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # Copies of BeeboScore 1.4.0 and earlier only look for "BeeboScore-<version>.exe". For the move to Lite, the 1.5.0 release
  # also carries the exe under that name, so their Check for updates finds it. Later releases don't need it: those copies
  # always pick the highest such file they can see, which stays 1.5.0.
  OLD_NAME_FOR: '1.5.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build the exe
        run: npm run dist

      - name: Read the version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Keep the exe with this run
        uses: actions/upload-artifact@v6
        with:
          name: BeeboScore-Lite-${{ steps.v.outputs.version }}
          path: dist/BeeboScore-Lite-${{ steps.v.outputs.version }}.exe
          if-no-files-found: error

      - name: The tag has to match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.v.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version ${{ steps.v.outputs.version }} in package.json"; exit 1
          fi

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          FILES=("dist/BeeboScore-Lite-$VERSION.exe")
          if [ "$VERSION" = "$OLD_NAME_FOR" ]; then cp "dist/BeeboScore-Lite-$VERSION.exe" "dist/BeeboScore-$VERSION.exe"; FILES+=("dist/BeeboScore-$VERSION.exe"); fi
          NOTES="docs/release-notes/$VERSION.md"
          if [ -f "$NOTES" ]; then FLAGS=(--notes-file "$NOTES"); else FLAGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --draft --title "BeeboScore Lite $VERSION" "${FLAGS[@]}"
