<!DOCTYPE html>
<!-- BeeboScore (developed by Beebo): the picture shown while the portable exe unpacks itself (desktop/splash.bmp).
     It appears the moment the exe is started, and after "Restart & update", until the app's own window opens.
     To change it: edit this page, open it in a browser at 100% zoom, take a 560 x 220 screenshot of the card and save it
     as a 24-bit BMP at desktop/splash.bmp (no transparency: the picture is shown as a plain rectangle).
     The logo is docs/images/logo.png. -->
<html lang="en"><head><meta charset="utf-8"><title>BeeboScore starting screen</title>
<style>
  @font-face { font-family: 'Saira Condensed'; font-weight: 800; src: url(../../public/fonts/saira-condensed-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Chakra Petch'; font-weight: 600; src: url(../../public/fonts/chakra-petch-latin-600-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #12141b; }
  .card { position: relative; width: 560px; height: 220px; box-sizing: border-box; border: 2px solid #3a4052; background: linear-gradient(180deg, #1b1e29, #12141b); color: #fff; overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; width: 190px; height: 100%; background: linear-gradient(160deg, #ff4b5f, #b3122b); clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); }
  .band img { position: absolute; left: 28px; top: 50%; width: 112px; height: 112px; transform: translateY(-50%); }
  .text { position: absolute; left: 206px; right: 24px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  h1 { margin: 0; font: 800 54px/1 'Saira Condensed', sans-serif; letter-spacing: 1px; }
  p { margin: 12px 0 0; font: 600 19px/1.35 'Chakra Petch', sans-serif; color: #e8ebf3; }
  small { margin-top: 14px; font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 2px; color: #9aa2b6; text-transform: uppercase; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: linear-gradient(90deg, #ff4b5f, #ffb36b); }
</style></head>
<body><div class="card"><div class="band"><img src="../../docs/images/logo.png" alt=""></div>
<div class="text"><h1>BeeboScore</h1><p>Starting up. This takes a few seconds.</p><small>Developed by Beebo</small></div><div class="bar"></div></div></body></html>
