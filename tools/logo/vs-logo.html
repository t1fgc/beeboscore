<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:A;src:url(../../public/fonts/racing-sans-one-latin-400-normal.woff2)}
@font-face{font-family:B;src:url(../../public/fonts/russo-one-latin-400-normal.woff2)}
@font-face{font-family:C;src:url(../../public/fonts/saira-condensed-latin-800-normal.woff2)}
html,body{margin:0;background:transparent}
.row{display:flex;gap:40px;padding:20px}
.i{width:1024px;height:1024px;border-radius:226px;position:relative;overflow:hidden;flex:none;
  background:radial-gradient(120% 90% at 22% 12%, #ff6a55 0%, rgba(255,106,85,0) 55%), linear-gradient(150deg,#f5283a 0%,#d70f24 42%,#8c0613 100%)}
.i::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 10px rgba(255,255,255,.10), inset 0 -60px 120px rgba(60,0,8,.45)}
.t{position:absolute;inset:0;display:grid;place-items:center;color:#fff;line-height:1;text-shadow:0 14px 0 rgba(80,0,10,.55), 0 30px 60px rgba(60,0,8,.5)}
.a .t{font:400 600px A;letter-spacing:-.04em;padding-right:30px;padding-top:10px}
.b .t{font:400 520px B;transform:skewX(-10deg);letter-spacing:-.03em}
.c .t{font:800 700px C;transform:skewX(-10deg);letter-spacing:-.02em;padding-bottom:20px}
.m{width:1024px;height:1024px;position:relative;flex:none}.m .t{font:800 880px C;transform:skewX(-10deg);letter-spacing:-.02em;text-shadow:none;padding-bottom:30px}</style></head><body><div class="row"><div class="i a" id="a"><div class="t">VS</div></div><div class="i b" id="b"><div class="t">VS</div></div><div class="i c" id="c"><div class="t">VS</div></div><div class="m" id="m"><div class="t">VS</div></div></div></body></html>
