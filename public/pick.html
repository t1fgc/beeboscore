<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick player — BeeboScore</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --bg: #0a0b10; --card: #151822; --card-2: #1c2030; --line: #252a3a; --text: #eef1f7; --muted: #8b93a7; --p1: #ff3b5c; --p2: #3b8eff; --accent: #ffb020; --side: var(--p1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.35 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: column; padding: 14px; gap: 10px; border-top: 4px solid var(--side); }
  body.p2 { --side: var(--p2); }
  h1 { margin: 0; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  h1 b { color: var(--side); font-size: 15px; letter-spacing: 1px; }
  h1 .now { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  #q { width: 100%; font: 600 22px inherit; padding: 12px 14px; background: var(--card); color: var(--text); border: 2px solid var(--side); border-radius: 12px; outline: none; }
  #list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  .it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--card); border: 1px solid transparent; cursor: pointer; }
  .it.on, .it:hover { border-color: var(--side); background: var(--card-2); }
  .it .av { width: 36px; height: 36px; border-radius: 8px; flex: none; background: var(--card-2) center/cover; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
  .it .nm { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .tm { color: var(--accent); font-weight: 700; margin-right: 4px; }
  .it .meta { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .it .src { font-size: 10px; font-weight: 800; letter-spacing: 1px; color: #111; background: var(--accent); padding: 2px 6px; border-radius: 4px; }
  .it.new .nm { color: var(--muted); font-weight: 600; } .it.new .nm b { color: var(--text); }
  .foot { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; }
  kbd { font: 600 11px inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text); }
  .flash { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,11,16,.92); font-size: 22px; font-weight: 700; color: var(--side); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .flash.on { opacity: 1; }
</style>
</head>
<body>
  <h1>Set <b id="who">Player 1</b> <span class="now" id="now"></span></h1>
  <input id="q" placeholder="Type a name…" autocomplete="off" spellcheck="false" autofocus>
  <div id="list"></div>
  <div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> set</span><span><kbd>Tab</kbd> switch player</span><span><kbd>Esc</kbd> close</span></div>
  <div class="flash" id="flash"></div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let side = new URLSearchParams(location.search).get('side') === '2' ? 2 : 1;
  let players = [], items = [], idx = 0, state = null;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[^\p{L}\p{N}]+/gu, '');
  async function api(path, body) {
    const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401) { location.href = '/login'; throw new Error('sign in'); }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'failed');
    return d;
  }
  function header() {
    document.body.className = 'p' + side;
    $('who').textContent = 'Player ' + side;
    const cur = state && state['p' + side];
    $('now').textContent = cur && cur.name ? 'now: ' + cur.name : '';
  }
  function rank(q) {
    const nq = norm(q);
    if (!nq) return players.slice(0, 40);
    const out = [];
    for (const p of players) {
      const n = norm(p.name), t = norm(p.team);
      let s = -1;
      if (n === nq) s = 0; else if (n.startsWith(nq)) s = 1; else if (n.includes(nq)) s = 2; else if (t && t.startsWith(nq)) s = 3;
      else if (nq.length >= 3) { let k = 0; for (const ch of n) if (ch === nq[k]) k++; if (k === nq.length) s = 4; }
      if (s >= 0) out.push([s, p]);
    }
    return out.sort((a, b) => a[0] - b[0] || a[1].name.length - b[1].name.length).map(x => x[1]).slice(0, 40);
  }
  function draw() {
    const q = $('q').value.trim();
    items = rank(q);
    if (q && !items.some(p => p.name.toLowerCase() === q.toLowerCase())) items.push({ name: q, _new: true });
    idx = Math.min(idx, Math.max(0, items.length - 1));
    $('list').innerHTML = items.length ? items.map((p, i) => p._new
      ? `<div class="it new ${i === idx ? 'on' : ''}" data-i="${i}"><div class="av">+</div><div class="nm">Use “<b>${esc(p.name)}</b>”</div></div>`
      : `<div class="it ${i === idx ? 'on' : ''}" data-i="${i}"><div class="av" style="${p.avatar ? `background-image:url('${esc(p.avatar)}')` : ''}">${p.avatar ? '' : esc(p.name.charAt(0).toUpperCase())}</div>
          <div class="nm">${p.team ? `<span class="tm">${esc(p.team)}</span>` : ''}${esc(p.name)}</div>
          <span class="meta">${esc([p.character, p.country && p.country.toUpperCase()].filter(Boolean).join(' · '))}</span>${p.sggId ? '<span class="src">START.GG</span>' : ''}</div>`).join('')
      : '<p style="color:var(--muted)">No players yet — type a name.</p>';
    const on = $('list').querySelector('.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  }
  async function choose(i) {
    const p = items[i]; if (!p) return;
    const player = p._new ? { name: p.name } : p;
    try {
      await api('/api/remote/action', { action: 'setPlayer', side, player });
      $('flash').textContent = `Player ${side}: ${player.name}`; $('flash').classList.add('on');
      setTimeout(() => window.close(), 450);
    } catch (e) { $('flash').textContent = e.message; $('flash').classList.add('on'); setTimeout(() => $('flash').classList.remove('on'), 1500); }
  }
  $('q').addEventListener('input', () => { idx = 0; draw(); });
  $('list').addEventListener('mousedown', e => { const it = e.target.closest('.it'); if (it) { e.preventDefault(); choose(Number(it.dataset.i)); } });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(idx); }
    else if (e.key === 'Tab') { e.preventDefault(); side = side === 1 ? 2 : 1; header(); $('q').focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); window.close(); }
  });
  // the desktop app reuses this window: it can switch sides without reloading
  window.beeboPick = s => { side = s === 2 ? 2 : 1; $('q').value = ''; idx = 0; header(); draw(); $('q').focus(); $('flash').classList.remove('on'); load(); };
  async function load() {
    try { [players, state] = await Promise.all([api('/api/players'), api('/api/state')]); } catch {}
    header(); draw();
  }
  header(); load(); $('q').focus();
})();
</script>
</body>
</html>
