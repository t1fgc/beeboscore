<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeeboScore Lite — self-test</title>
<script src="/static/beebo-icons.js"></script><script>BI.watch(document, {})</script>
<style>
[hidden]{display:none!important}   /* 1.12.20: hidden means hidden, whatever display a class sets */
  :root { --bg: #0e0f14; --card: #171922; --line: #2a2d3b; --text: #eceef3; --muted: #8b90a3; --ok: #3ddc84; --warn: #ffb020; --bad: #ff5d6c; color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 16px 40px; }
  h1 { margin: 0 0 4px; font-size: 26px; } p.lead { color: var(--muted); margin: 0 0 18px; }
  button { font: inherit; font-weight: 700; background: #ff6a1f; color: #160800; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; } button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; }
  .row .i { font-size: 18px; line-height: 1.2; } .row b { display: block; } .row small { color: var(--muted); display: block; margin-top: 2px; overflow-wrap: anywhere; } .row em { color: var(--muted); font-style: normal; font-size: 12px; }
  .ok .i { color: var(--ok); } .warn .i { color: var(--warn); } .bad .i { color: var(--bad); } .bad { border-color: rgba(255,93,108,.5); }
  .row img { display: block; margin-top: 8px; width: 240px; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); }
  .sum { margin: 16px 0 0; font-weight: 700; } .bar { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>🩺 BeeboScore Lite self-test</h1>
  <p class="lead">Checks the parts that depend on this PC: saving files, encrypted sign-ins, saving the standings picture, potato mode, OBS, going online, start.gg and Twitch. Nothing is changed and nothing is sent anywhere except a sign-in check with start.gg if you're signed in.</p>
  <div class="bar"><button id="run">Run the self-test</button><button class="ghost" id="copy" hidden>Copy the results</button></div>
  <div id="out"></div>
  <p class="sum" id="sum"></p>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let last = null;
  async function run() {
    $('#run').disabled = true; $('#run').textContent = 'Testing…'; $('#out').innerHTML = ''; $('#sum').textContent = '';
    try {
      const r = await fetch('/api/selftest', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).then(x => x.json());
      if (r.error) throw new Error(r.error);
      last = r;
      $('#out').innerHTML = r.results.map(t => `<div class="row ${!t.ok ? 'bad' : t.warn ? 'warn' : 'ok'}" data-id="${esc(t.id)}"><span class="i">${!t.ok ? '✖' : t.warn ? '●' : '✔'}</span><div><b>${esc(t.label)}</b><small>${esc(t.detail)}</small>${t.img ? `<img alt="Test picture" src="${t.img}">` : ''}</div><em>${t.ms} ms</em></div>`).join('');
      const bad = r.results.filter(t => !t.ok).length, warn = r.results.filter(t => t.ok && t.warn).length;
      $('#sum').textContent = bad ? `${bad} problem${bad === 1 ? '' : 's'} found.` : warn ? `All good — ${warn} optional thing${warn === 1 ? '' : 's'} not set up.` : 'All good ✔';
      $('#copy').hidden = false;
    } catch (e) { $('#sum').textContent = 'The self-test couldn’t run: ' + e.message; }
    $('#run').disabled = false; $('#run').textContent = 'Run it again';
  }
  $('#run').onclick = run;
  $('#copy').onclick = () => { if (!last) return; const txt = last.results.map(t => `${!t.ok ? 'FAIL' : t.warn ? 'note' : 'ok  '}  ${t.label}: ${t.detail}`).join('\n'); navigator.clipboard.writeText(txt).then(() => { $('#copy').textContent = 'Copied'; setTimeout(() => { $('#copy').textContent = 'Copy the results'; }, 1500); }); };
  if (/[?&]run\b/.test(location.search)) run();
})();
</script>
</body>
</html>
